name: web

# The web/ static-site source isn't in the repo yet — this workflow is
# kept scaffolded for when it is. Until then, trigger only on manual
# workflow_dispatch so the repo's public CI badges stay green.
on:
  workflow_dispatch:

jobs:
  build:
    name: build (static export)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Upload static site as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ticktrace-site
          path: web/out
          if-no-files-found: error

