[package]
name = "bme280_demo"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "bme280_demo"
path = "src/main.rs"

[dependencies]
rp-asm-sys = { path = "../../rust_bridge/rp-asm-sys" }
rp-asm-hal = { path = "../../rust_bridge/rp-asm-hal" }
rp-asm-rt  = { path = "../../rust_bridge/rp-asm-rt" }

embedded-hal = "1.0"

# Bosch BME280 humidity / temperature / pressure sensor.  Uses i2c-only
# fork of the popular driver that's been ported to embedded-hal 1.0.
bme280-rs = "0.4"

[profile.release]
opt-level    = "s"
lto          = true
codegen-units = 1
panic        = "abort"
debug        = false
strip        = true
