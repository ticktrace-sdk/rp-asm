# Build and publish the ticktrace SDK container images to GHCR.
#
# Images:
#   ghcr.io/ticktrace-sdk/sdk:slim   - build-only, ~250 MB
#   ghcr.io/ticktrace-sdk/sdk:full   - build + T1/T2/test-tools, ~800 MB
#
# Tagging:
#   - 'main' branch          -> :slim, :full, :slim-latest, :full-latest
#   - 'v*' git tags          -> :slim-<ver>, :full-<ver> (plus :slim/:full
#                                pointers when the tag is the newest)
#   - pull requests          -> built but NOT pushed (smoke test only)
#
# Architectures: linux/amd64, linux/arm64 (covers x86 Linux/Windows hosts,
# Apple Silicon Macs, and Raspberry Pi build hosts).

name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [slim, full]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute tags: branch builds get :<target> (rolling), tag builds get
      # :<target>-<version> plus the rolling :<target> pointer.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sdk
          tags: |
            type=raw,value=${{ matrix.target }},enable={{is_default_branch}}
            type=raw,value=${{ matrix.target }}-latest,enable={{is_default_branch}}
            type=match,pattern=v(.*),group=1,prefix=${{ matrix.target }}-
            type=ref,event=pr,prefix=${{ matrix.target }}-pr-

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: false
