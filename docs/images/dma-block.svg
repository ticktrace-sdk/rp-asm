<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="ui-monospace, Menlo, Monaco, monospace" font-size="13">
  <style>
    text { fill: #1f2937; }
    .title    { font-size: 16px; font-weight: bold; }
    .small    { font-size: 11px; fill: #6b7280; }
    .mono     { font-size: 11px; }
    .label    { font-weight: bold; }
    .container { fill: none; stroke: #2563eb; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .channels  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
    .irq       { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; }
    .pace      { fill: #fed7aa; stroke: #c2410c; stroke-width: 1.5; }
    .sniff     { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.5; }
    .bus       { fill: #f3f4f6; stroke: #374151; stroke-width: 1.5; }
    .target    { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .wire      { fill: none; stroke: #374151; stroke-width: 2; }
    .wirelbl   { font-size: 11px; fill: #374151; }

    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; }
      .small { fill: #9ca3af; }
      .wirelbl { fill: #d1d5db; }
      .wire { stroke: #d1d5db; }
      .container { stroke: #93c5fd; }
      .channels  { fill: #1e3a8a; stroke: #93c5fd; }
      .irq       { fill: #78350f; stroke: #fbbf24; }
      .pace      { fill: #7c2d12; stroke: #fb923c; }
      .sniff     { fill: #4c1d95; stroke: #c4b5fd; }
      .bus       { fill: #1f2937; stroke: #d1d5db; }
      .target    { fill: #14532d; stroke: #86efac; }
    }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#374151"/>
    </marker>
  </defs>

  <text x="20" y="28" class="title">RP2350 DMA controller</text>
  <text x="20" y="46" class="small">Four subsystems behind a single AHB-Lite master, addressed at 0x50000000.</text>

  <!-- Container: DMA controller -->
  <rect class="container" x="40" y="70" width="740" height="290" rx="10"/>
  <text x="60" y="92" class="label">DMA controller @ 0x50000000</text>

  <!-- Top-left: 16 channels -->
  <g transform="translate(60,110)">
    <rect class="channels" x="0" y="0" width="340" height="100" rx="6"/>
    <text x="170" y="22" text-anchor="middle" class="label">16 channels</text>
    <text x="170" y="44" text-anchor="middle" class="mono">ch0..ch15</text>
    <text x="170" y="62" text-anchor="middle" class="small">READ_ADDR / WRITE_ADDR / TRANS_COUNT / CTRL</text>
    <text x="170" y="80" text-anchor="middle" class="small">+ 4 alias sets (AL1/AL2/AL3, different trigger word)</text>
  </g>

  <!-- Top-right: IRQ aggregators -->
  <g transform="translate(420,110)">
    <rect class="irq" x="0" y="0" width="340" height="100" rx="6"/>
    <text x="170" y="22" text-anchor="middle" class="label">4 IRQ aggregators</text>
    <text x="170" y="44" text-anchor="middle" class="mono">INTE0..3 / INTF0..3 / INTS0..3 / INTR</text>
    <text x="170" y="62" text-anchor="middle" class="small">Each aggregator OR-reduces channel completion</text>
    <text x="170" y="80" text-anchor="middle" class="small">into one NVIC line. Force / mask / status / raw.</text>
  </g>

  <!-- Bottom-left: Pacing TIMERs -->
  <g transform="translate(60,230)">
    <rect class="pace" x="0" y="0" width="340" height="100" rx="6"/>
    <text x="170" y="22" text-anchor="middle" class="label">4 pacing TIMERs</text>
    <text x="170" y="44" text-anchor="middle" class="mono">TIMER0..3 = X/Y fraction divider</text>
    <text x="170" y="62" text-anchor="middle" class="small">Emit DREQs 59..62 at a programmable rate.</text>
    <text x="170" y="80" text-anchor="middle" class="small">Lets channels stream at fixed bandwidth without IRQs.</text>
  </g>

  <!-- Bottom-right: Sniffer / CRC -->
  <g transform="translate(420,230)">
    <rect class="sniff" x="0" y="0" width="340" height="100" rx="6"/>
    <text x="170" y="22" text-anchor="middle" class="label">1 sniffer / CRC unit</text>
    <text x="170" y="44" text-anchor="middle" class="mono">SNIFF_CTRL / SNIFF_DATA</text>
    <text x="170" y="62" text-anchor="middle" class="small">Hardware accumulator on one chosen channel:</text>
    <text x="170" y="80" text-anchor="middle" class="small">CRC32, CRC16, SUM, XOR, no extra cycles.</text>
  </g>

  <!-- Vertical wire from container down to bus -->
  <line class="wire" x1="410" y1="360" x2="410" y2="400" marker-end="url(#arrowhead)"/>

  <!-- AHB-Lite bus master -->
  <g transform="translate(260,400)">
    <rect class="bus" x="0" y="0" width="300" height="50" rx="6"/>
    <text x="150" y="22" text-anchor="middle" class="label">AHB-Lite bus master</text>
    <text x="150" y="40" text-anchor="middle" class="small">single arbitrated master for the whole controller</text>
  </g>

  <!-- Wires from bus to three targets -->
  <line class="wire" x1="320" y1="450" x2="150" y2="485" marker-end="url(#arrowhead)"/>
  <line class="wire" x1="410" y1="450" x2="410" y2="485" marker-end="url(#arrowhead)"/>
  <line class="wire" x1="500" y1="450" x2="670" y2="485" marker-end="url(#arrowhead)"/>

  <!-- Three targets -->
  <g transform="translate(80,485)">
    <rect class="target" x="0" y="0" width="140" height="25" rx="4"/>
    <text x="70" y="17" text-anchor="middle" class="label">SRAM</text>
  </g>
  <g transform="translate(340,485)">
    <rect class="target" x="0" y="0" width="140" height="25" rx="4"/>
    <text x="70" y="17" text-anchor="middle" class="label">XIP (flash)</text>
  </g>
  <g transform="translate(600,485)">
    <rect class="target" x="0" y="0" width="140" height="25" rx="4"/>
    <text x="70" y="17" text-anchor="middle" class="label">peripherals (SPI/I2C/PIO/...)</text>
  </g>
</svg>
