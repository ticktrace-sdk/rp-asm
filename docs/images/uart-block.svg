<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="ui-monospace, Menlo, Monaco, monospace" font-size="13">
  <style>
    text { fill: #1f2937; }
    .title    { font-size: 16px; font-weight: bold; }
    .small    { font-size: 11px; fill: #6b7280; }
    .mono     { font-size: 11px; }
    .label    { font-weight: bold; }
    .container { fill: none; stroke: #2563eb; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .fifo     { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
    .shift    { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; }
    .pin      { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .flow     { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.5; }
    .meta     { fill: #f3f4f6; stroke: #374151; stroke-width: 1; }
    .wire     { fill: none; stroke: #374151; stroke-width: 2; }
    .wirelbl  { font-size: 11px; fill: #374151; }

    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; }
      .small { fill: #9ca3af; }
      .wirelbl { fill: #d1d5db; }
      .wire { stroke: #d1d5db; }
      .container { stroke: #93c5fd; }
      .fifo { fill: #1e3a8a; stroke: #93c5fd; }
      .shift { fill: #78350f; stroke: #fbbf24; }
      .pin { fill: #14532d; stroke: #86efac; }
      .flow { fill: #4c1d95; stroke: #c4b5fd; }
      .meta { fill: #1f2937; stroke: #9ca3af; }
    }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#374151"/>
    </marker>
  </defs>

  <text x="20" y="28" class="title">RP2350 UART block (ARM PL011)</text>
  <text x="20" y="46" class="small">UART0 at 0x40070000, UART1 at 0x40078000. Layout is identical; only pin choices and DREQ/NVIC numbers differ.</text>

  <!-- Container -->
  <rect class="container" x="40" y="70" width="740" height="320" rx="10"/>
  <text x="60" y="92" class="label">One UART instance (PL011)</text>

  <!-- TX path: FIFO -> shift -> TX pin -->
  <g transform="translate(60,120)">
    <rect class="fifo" x="0" y="0" width="160" height="60" rx="6"/>
    <text x="80" y="22" text-anchor="middle" class="label">TX FIFO</text>
    <text x="80" y="40" text-anchor="middle" class="small">32 bytes deep</text>
    <text x="80" y="55" text-anchor="middle" class="small">IFLS sets threshold</text>
  </g>
  <line class="wire" x1="220" y1="150" x2="270" y2="150" marker-end="url(#arrowhead)"/>

  <g transform="translate(270,120)">
    <rect class="shift" x="0" y="0" width="140" height="60" rx="6"/>
    <text x="70" y="22" text-anchor="middle" class="label">TX shift</text>
    <text x="70" y="40" text-anchor="middle" class="small">serialise 1 bit per</text>
    <text x="70" y="55" text-anchor="middle" class="small">baud period</text>
  </g>
  <line class="wire" x1="410" y1="150" x2="460" y2="150" marker-end="url(#arrowhead)"/>

  <g transform="translate(460,120)">
    <rect class="pin" x="0" y="0" width="140" height="60" rx="6"/>
    <text x="70" y="22" text-anchor="middle" class="label">TX pin</text>
    <text x="70" y="40" text-anchor="middle" class="mono">GP0 (UART0)</text>
    <text x="70" y="55" text-anchor="middle" class="mono">GP4 (UART1)</text>
  </g>

  <!-- CTS pin (hw flow, optional) -->
  <g transform="translate(620,120)">
    <rect class="flow" x="0" y="0" width="140" height="60" rx="6"/>
    <text x="70" y="22" text-anchor="middle" class="label">CTS pin</text>
    <text x="70" y="40" text-anchor="middle" class="mono">GP2 (UART0)</text>
    <text x="70" y="55" text-anchor="middle" class="mono">GP6 (UART1)</text>
  </g>

  <!-- RX path: pin -> shift -> FIFO -->
  <g transform="translate(60,220)">
    <rect class="fifo" x="0" y="0" width="160" height="60" rx="6"/>
    <text x="80" y="22" text-anchor="middle" class="label">RX FIFO</text>
    <text x="80" y="40" text-anchor="middle" class="small">32 bytes deep</text>
    <text x="80" y="55" text-anchor="middle" class="small">RTIM = idle timeout</text>
  </g>
  <line class="wire" x1="270" y1="250" x2="220" y2="250" marker-end="url(#arrowhead)"/>

  <g transform="translate(270,220)">
    <rect class="shift" x="0" y="0" width="140" height="60" rx="6"/>
    <text x="70" y="22" text-anchor="middle" class="label">RX shift</text>
    <text x="70" y="40" text-anchor="middle" class="small">deserialise + parity</text>
    <text x="70" y="55" text-anchor="middle" class="small">+ framing check</text>
  </g>
  <line class="wire" x1="460" y1="250" x2="410" y2="250" marker-end="url(#arrowhead)"/>

  <g transform="translate(460,220)">
    <rect class="pin" x="0" y="0" width="140" height="60" rx="6"/>
    <text x="70" y="22" text-anchor="middle" class="label">RX pin</text>
    <text x="70" y="40" text-anchor="middle" class="mono">GP1 (UART0)</text>
    <text x="70" y="55" text-anchor="middle" class="mono">GP5 (UART1)</text>
  </g>

  <!-- RTS pin -->
  <g transform="translate(620,220)">
    <rect class="flow" x="0" y="0" width="140" height="60" rx="6"/>
    <text x="70" y="22" text-anchor="middle" class="label">RTS pin</text>
    <text x="70" y="40" text-anchor="middle" class="mono">GP3 (UART0)</text>
    <text x="70" y="55" text-anchor="middle" class="mono">GP7 (UART1)</text>
  </g>

  <!-- Metadata block: NVIC + DREQ -->
  <g transform="translate(60,320)">
    <rect class="meta" x="0" y="0" width="700" height="55" rx="6"/>
    <text x="20" y="22" class="label">NVIC lines</text>
    <text x="120" y="22" class="mono">UART0_IRQ = 33, UART1_IRQ = 34</text>
    <text x="20" y="42" class="label">DREQ codes</text>
    <text x="120" y="42" class="mono">UART0_TX = 28, UART0_RX = 29, UART1_TX = 30, UART1_RX = 31</text>
  </g>

  <text x="20" y="470" class="small">Yellow = shift register, blue = FIFO, green = TX/RX pin choices per instance, purple = optional CTS/RTS flow-control pins.</text>
</svg>
