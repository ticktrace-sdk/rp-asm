<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="ui-monospace, Menlo, Monaco, monospace" font-size="13">
  <style>
    text { fill: #1f2937; }
    .title    { font-size: 16px; font-weight: bold; }
    .small    { font-size: 11px; fill: #6b7280; }
    .label    { font-weight: bold; }
    .ticks    { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; }
    .timer    { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
    .irq      { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .wire     { fill: none; stroke: #374151; stroke-width: 2; }
    .wirelbl  { font-size: 11px; fill: #374151; }

    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; }
      .small { fill: #9ca3af; }
      .wirelbl { fill: #d1d5db; }
      .wire { stroke: #d1d5db; }
      .ticks { fill: #78350f; stroke: #fbbf24; }
      .timer { fill: #1e3a8a; stroke: #93c5fd; }
      .irq   { fill: #7f1d1d; stroke: #f87171; }
    }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#374151"/>
    </marker>
  </defs>

  <text x="20" y="28" class="title">RP2350 TIMER block</text>
  <text x="20" y="46" class="small">TICKS subsystem distributes a 1 MHz tick to two independent 64-bit timers, each with four alarms wired to NVIC.</text>

  <!-- TICKS source -->
  <g transform="translate(40,160)">
    <rect class="ticks" x="0" y="0" width="140" height="60" rx="6"/>
    <text x="70" y="22" text-anchor="middle" class="label">TICKS</text>
    <text x="70" y="40" text-anchor="middle" class="small">1 MHz tick</text>
    <text x="70" y="55" text-anchor="middle" class="small">(set up by tick_init)</text>
  </g>

  <!-- Horizontal trunk + branch up + branch down -->
  <line class="wire" x1="180" y1="190" x2="240" y2="190"/>
  <line class="wire" x1="240" y1="100" x2="240" y2="280"/>
  <line class="wire" x1="240" y1="100" x2="300" y2="100" marker-end="url(#arrowhead)"/>
  <line class="wire" x1="240" y1="280" x2="300" y2="280" marker-end="url(#arrowhead)"/>

  <!-- TIMER0 -->
  <g transform="translate(300,70)">
    <rect class="timer" x="0" y="0" width="220" height="80" rx="6"/>
    <text x="110" y="22" text-anchor="middle" class="label">TIMER0</text>
    <text x="110" y="40" text-anchor="middle" class="small">0x400b0000</text>
    <text x="110" y="58" text-anchor="middle" class="small">64-bit us counter</text>
    <text x="110" y="72" text-anchor="middle" class="small">4 alarms (ALARM0..3)</text>
  </g>

  <!-- TIMER1 -->
  <g transform="translate(300,250)">
    <rect class="timer" x="0" y="0" width="220" height="80" rx="6"/>
    <text x="110" y="22" text-anchor="middle" class="label">TIMER1</text>
    <text x="110" y="40" text-anchor="middle" class="small">0x400b8000</text>
    <text x="110" y="58" text-anchor="middle" class="small">64-bit us counter</text>
    <text x="110" y="72" text-anchor="middle" class="small">4 alarms (ALARM0..3)</text>
  </g>

  <!-- TIMER0 -> NVIC IRQs -->
  <line class="wire" x1="520" y1="110" x2="580" y2="110" marker-end="url(#arrowhead)"/>
  <g transform="translate(580,80)">
    <rect class="irq" x="0" y="0" width="200" height="60" rx="6"/>
    <text x="100" y="22" text-anchor="middle" class="label">NVIC IRQ 0..3</text>
    <text x="100" y="40" text-anchor="middle" class="small">TIMER0_IRQ_0 .. TIMER0_IRQ_3</text>
    <text x="100" y="55" text-anchor="middle" class="small">one per alarm</text>
  </g>

  <!-- TIMER1 -> NVIC IRQs -->
  <line class="wire" x1="520" y1="290" x2="580" y2="290" marker-end="url(#arrowhead)"/>
  <g transform="translate(580,260)">
    <rect class="irq" x="0" y="0" width="200" height="60" rx="6"/>
    <text x="100" y="22" text-anchor="middle" class="label">NVIC IRQ 4..7</text>
    <text x="100" y="40" text-anchor="middle" class="small">TIMER1_IRQ_0 .. TIMER1_IRQ_3</text>
    <text x="100" y="55" text-anchor="middle" class="small">one per alarm</text>
  </g>
</svg>
